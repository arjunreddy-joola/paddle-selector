<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head><body>
<div style="display:flex;flex-direction:column;gap:10px;max-width:420px">
  <label style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow" style="margin:0">Email</span>
    <input placeholder="you@example.com" style="padding:12px 14px;border:1px solid #000;background:#fff;font-family:inherit;font-size:14px;border-radius:2px" value="player@joola.com">
  </label>
  <label style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow" style="margin:0">Size</span>
    <div style="display:flex;gap:8px"><button style="padding:10px 16px;background:#000;color:#fff;border:1px solid #000;font-size:12px;font-weight:700;border-radius:2px">16mm</button><button style="padding:10px 16px;background:#fff;color:#000;border:1px solid #cfcfcf;font-size:12px;font-weight:700;border-radius:2px">14mm</button></div>
  </label>
  <label style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow" style="margin:0">Quantity</span>
    <div style="display:inline-flex;border:1px solid #000;width:fit-content"><button style="padding:8px 14px;border:none;background:#fff;font-size:14px">−</button><div style="padding:8px 16px;border-left:1px solid #000;border-right:1px solid #000;font-weight:600">1</div><button style="padding:8px 14px;border:none;background:#fff;font-size:14px">+</button></div>
  </label>
</div>
</body></html>
