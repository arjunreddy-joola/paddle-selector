<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <span style="background:#000;color:#fff;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase">NEW</span>
  <span style="background:#D9232B;color:#fff;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase">Sale</span>
  <span style="background:#fff;color:#000;border:1px solid #000;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase">Just Dropped</span>
  <span style="background:#e5e5e5;color:#3a3a3a;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase">Out of Stock</span>
  <span style="background:#000;color:#fff;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;border-radius:999px">NEW</span>
  <span style="background:#F4C021;color:#000;padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;border-radius:999px">Limited</span>
</div>
<p style="margin-top:12px;font-size:12px;color:#6b6b6b">Square badges sit on product tiles (top-left). Pill badges are used in navigation and marquee announcements.</p>
</body></html>
