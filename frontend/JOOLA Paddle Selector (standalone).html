document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0e067c60-fa05-455d-8eb9-c62658488bef\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>/* ============================================================\n   JOOLA · Material Design 3 — design tokens\n   ------------------------------------------------------------\n   Strict M3 mechanics. Brand layer = JOOLA yellow seed +\n   FK Grotesk Neue type. All values follow the M3 spec:\n     • Tonal palettes at standard tones 0–100 (HCT-derived)\n     • sys.color roles (light + dark)\n     • sys.typescale (Display / Headline / Title / Body / Label)\n     • sys.shape, sys.elevation, sys.state, sys.motion\n\n   Layers\n     1. ref.palette       — tonal palettes per key color\n     2. sys.color         — semantic roles (light by default,\n                            dark via .theme-dark / [data-theme=dark])\n     3. sys.typescale     — type family + size/lh/tracking\n     4. sys.shape         — corner sizes\n     5. sys.elevation     — 6 levels (0–5)\n     6. sys.state         — state-layer opacities\n     7. sys.motion        — durations + easings\n   ============================================================ */\n\n/* ─── FONT FACES · FK Grotesk Neue + FK Grotesk Mono ─────── */\n@font-face{font-family:\"FK Grotesk Neue\";font-style:normal;font-weight:100;font-display:swap;src:url(\"69182c07-3320-4833-99ca-e7d625314c95\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:italic;font-weight:100;font-display:swap;src:url(\"f07b1d7e-cca1-4b17-b42e-18e894578d91\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:normal;font-weight:300;font-display:swap;src:url(\"35f772fd-2046-4185-ace9-6457e344ab86\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:italic;font-weight:300;font-display:swap;src:url(\"7274bcc4-1488-4af2-9fcd-9ef56b4734bd\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:normal;font-weight:400;font-display:swap;src:url(\"d5b41fb8-5706-4046-ab16-96fed126dc34\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:italic;font-weight:400;font-display:swap;src:url(\"c59b17e9-2206-4f64-9ff6-9288186cbfae\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:normal;font-weight:500;font-display:swap;src:url(\"997c9d3a-6a41-482f-9fb7-a4d61d697dac\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:italic;font-weight:500;font-display:swap;src:url(\"463e81d8-e5ac-4d97-b08a-7ef5d84dff38\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:normal;font-weight:700;font-display:swap;src:url(\"feaafea5-6112-4a43-b158-b3142a319ef4\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:italic;font-weight:700;font-display:swap;src:url(\"678b4230-5029-436b-8a7b-82177e7cd0a6\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:normal;font-weight:900;font-display:swap;src:url(\"889dbbe9-79cb-4e5d-ab03-cec21af14018\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Neue\";font-style:italic;font-weight:900;font-display:swap;src:url(\"b0c7ddbb-cc92-4f65-b9a2-62367bbdf7f3\") format(\"opentype\");}\n@font-face{font-family:\"FK Grotesk Mono\";font-style:normal;font-weight:500;font-display:swap;src:url(\"759c476e-47db-4b1f-81c9-e8ff6e62574a\") format(\"opentype\");}\n\n:root {\n  /* ─── ref.palette · PRIMARY · achromatic / Uber-style ──────\n     Pure black-and-white ramp. Monotonic from T0 (#000) up to\n     T100 (#FFF), matching the cool neutral hue so primary sits\n     harmoniously on neutral surfaces. T40 (light primary) and\n     T80 (dark-mode primary) are intentionally near the extremes\n     so the brand reads as solid black / solid white. */\n  --md-ref-palette-primary0:   #000000;\n  --md-ref-palette-primary10:  #0D0E0F;\n  --md-ref-palette-primary20:  #1A1B1C;\n  --md-ref-palette-primary25:  #1F2022;\n  --md-ref-palette-primary30:  #25262A;\n  --md-ref-palette-primary35:  #2A2B2F;\n  --md-ref-palette-primary40:  #2F3033;   /* token role · light primary tone */\n  --md-ref-palette-primary50:  #4A4B4E;\n  --md-ref-palette-primary60:  #65666A;\n  --md-ref-palette-primary70:  #808286;\n  --md-ref-palette-primary80:  #9C9DA1;\n  --md-ref-palette-primary90:  #C7C9CC;\n  --md-ref-palette-primary95:  #E3E5E8;\n  --md-ref-palette-primary98:  #F4F6F8;\n  --md-ref-palette-primary99:  #FAFBFC;\n  --md-ref-palette-primary100: #FFFFFF;\n\n  /* ─── ref.palette · SECONDARY · anchored T40 = #0053A5 ─────\n     JOOLA blue (~hue 212). Full-chroma at the brand tone, soft\n     containers in the upper register so it sits comfortably on\n     a warm-neutral surface. */\n  --md-ref-palette-secondary0:   #000000;\n  --md-ref-palette-secondary10:  #001B3D;\n  --md-ref-palette-secondary20:  #002F66;\n  --md-ref-palette-secondary25:  #003B7E;\n  --md-ref-palette-secondary30:  #004690;\n  --md-ref-palette-secondary35:  #004D9B;\n  --md-ref-palette-secondary40:  #0053A5;   /* ← anchor · brand blue */\n  --md-ref-palette-secondary50:  #316CB8;\n  --md-ref-palette-secondary60:  #5187CC;\n  --md-ref-palette-secondary70:  #74A2DD;\n  --md-ref-palette-secondary80:  #A0BFEC;\n  --md-ref-palette-secondary90:  #CFDEF8;\n  --md-ref-palette-secondary95:  #E7EEFC;\n  --md-ref-palette-secondary98:  #F5F8FE;\n  --md-ref-palette-secondary99:  #FBFCFF;\n  --md-ref-palette-secondary100: #FFFFFF;\n\n  /* Tertiary tonal palette removed — JOOLA uses a two-accent\n     system (primary black + secondary blue). The sys.color.tertiary\n     roles below alias to the secondary palette so any third-party\n     M3 component referencing them keeps working. */\n\n  /* ─── ref.palette · ERROR · Tailwind red, anchored T40 = #B91C1C ──\n     Maps Tailwind's red-50…950 scale onto the M3 tone ramp. */\n  --md-ref-palette-error0:   #000000;\n  --md-ref-palette-error10:  #450A0A;   /* tw red-950 */\n  --md-ref-palette-error20:  #7F1D1D;   /* tw red-900 */\n  --md-ref-palette-error25:  #891A1A;\n  --md-ref-palette-error30:  #991B1B;   /* tw red-800 */\n  --md-ref-palette-error35:  #A81B1B;\n  --md-ref-palette-error40:  #B91C1C;   /* ← anchor · tw red-700 */\n  --md-ref-palette-error50:  #DC2626;   /* tw red-600 */\n  --md-ref-palette-error60:  #EF4444;   /* tw red-500 */\n  --md-ref-palette-error70:  #F87171;   /* tw red-400 */\n  --md-ref-palette-error80:  #FCA5A5;   /* tw red-300 */\n  --md-ref-palette-error90:  #FECACA;   /* tw red-200 */\n  --md-ref-palette-error95:  #FEE2E2;   /* tw red-100 */\n  --md-ref-palette-error98:  #FEF2F2;   /* tw red-50  */\n  --md-ref-palette-error99:  #FFFBFB;\n  --md-ref-palette-error100: #FFFFFF;\n\n  /* ─── ref.palette · SUCCESS · Tailwind green, anchored T40 = #15803D ──\n     JOOLA extension for positive / confirmation states. Maps\n     Tailwind's green-50…950 scale onto the M3 tone ramp. */\n  --md-ref-palette-success0:   #000000;\n  --md-ref-palette-success10:  #052E16;   /* tw green-950 */\n  --md-ref-palette-success20:  #14532D;   /* tw green-900 */\n  --md-ref-palette-success25:  #155D32;\n  --md-ref-palette-success30:  #166534;   /* tw green-800 */\n  --md-ref-palette-success35:  #15723B;\n  --md-ref-palette-success40:  #15803D;   /* ← anchor · tw green-700 */\n  --md-ref-palette-success50:  #16A34A;   /* tw green-600 */\n  --md-ref-palette-success60:  #22C55E;   /* tw green-500 */\n  --md-ref-palette-success70:  #4ADE80;   /* tw green-400 */\n  --md-ref-palette-success80:  #86EFAC;   /* tw green-300 */\n  --md-ref-palette-success90:  #BBF7D0;   /* tw green-200 */\n  --md-ref-palette-success95:  #DCFCE7;   /* tw green-100 */\n  --md-ref-palette-success98:  #F0FDF4;   /* tw green-50  */\n  --md-ref-palette-success99:  #F7FEF9;\n  --md-ref-palette-success100: #FFFFFF;\n\n  /* ─── ref.palette · WARNING · Tailwind orange, anchored T40 = #C2410C ──\n     JOOLA extension for caution / pending states. Maps Tailwind's\n     orange-50…950 scale onto the M3 tone ramp (dark→light). */\n  --md-ref-palette-warning0:   #000000;\n  --md-ref-palette-warning10:  #431407;   /* tw orange-950 */\n  --md-ref-palette-warning20:  #7C2D12;   /* tw orange-900 */\n  --md-ref-palette-warning25:  #88300F;\n  --md-ref-palette-warning30:  #9A3412;   /* tw orange-800 */\n  --md-ref-palette-warning35:  #AE3B0E;\n  --md-ref-palette-warning40:  #C2410C;   /* ← anchor · tw orange-700 */\n  --md-ref-palette-warning50:  #EA580C;   /* tw orange-600 */\n  --md-ref-palette-warning60:  #F97316;   /* tw orange-500 */\n  --md-ref-palette-warning70:  #FB923C;   /* tw orange-400 */\n  --md-ref-palette-warning80:  #FDBA74;   /* tw orange-300 */\n  --md-ref-palette-warning90:  #FED7AA;   /* tw orange-200 */\n  --md-ref-palette-warning95:  #FFEDD5;   /* tw orange-100 */\n  --md-ref-palette-warning98:  #FFF7ED;   /* tw orange-50  */\n  --md-ref-palette-warning99:  #FFFBF5;\n  --md-ref-palette-warning100: #FFFFFF;\n\n  /* ─── ref.palette · NEUTRAL · cool grey, anchored at T94 = #EFF1F2 ── */\n  --md-ref-palette-neutral0:   #000000;\n  --md-ref-palette-neutral4:   #0B0C0D;\n  --md-ref-palette-neutral6:   #101112;\n  --md-ref-palette-neutral10:  #1A1B1C;\n  --md-ref-palette-neutral12:  #1E1F21;\n  --md-ref-palette-neutral17:  #292A2C;\n  --md-ref-palette-neutral20:  #303133;\n  --md-ref-palette-neutral22:  #343538;\n  --md-ref-palette-neutral24:  #393A3C;\n  --md-ref-palette-neutral25:  #3B3D3F;\n  --md-ref-palette-neutral30:  #474849;\n  --md-ref-palette-neutral35:  #535456;\n  --md-ref-palette-neutral40:  #5F6062;\n  --md-ref-palette-neutral50:  #78797B;\n  --md-ref-palette-neutral60:  #919395;\n  --md-ref-palette-neutral70:  #ACADAF;\n  --md-ref-palette-neutral80:  #C7C9CA;\n  --md-ref-palette-neutral87:  #DBDDDE;\n  --md-ref-palette-neutral90:  #E3E5E6;\n  --md-ref-palette-neutral92:  #E9EBEC;\n  --md-ref-palette-neutral94:  #EFF1F2;   /* ← anchor · surface-container */\n  --md-ref-palette-neutral95:  #F1F3F4;\n  --md-ref-palette-neutral96:  #F3F5F6;\n  --md-ref-palette-neutral98:  #F8FAFB;\n  --md-ref-palette-neutral99:  #FCFDFE;\n  --md-ref-palette-neutral100: #FFFFFF;\n\n  /* ─── ref.palette · NEUTRAL VARIANT · cool, slightly chromatic ── */\n  --md-ref-palette-neutral-variant0:   #000000;\n  --md-ref-palette-neutral-variant10:  #181B1F;\n  --md-ref-palette-neutral-variant20:  #2D3034;\n  --md-ref-palette-neutral-variant25:  #383B3F;\n  --md-ref-palette-neutral-variant30:  #43464A;\n  --md-ref-palette-neutral-variant35:  #4F5256;\n  --md-ref-palette-neutral-variant40:  #5B5E62;\n  --md-ref-palette-neutral-variant50:  #74777B;\n  --md-ref-palette-neutral-variant60:  #8E9196;\n  --md-ref-palette-neutral-variant70:  #A9ACB1;\n  --md-ref-palette-neutral-variant80:  #C4C7CC;\n  --md-ref-palette-neutral-variant90:  #E0E3E7;\n  --md-ref-palette-neutral-variant95:  #EFF1F5;\n  --md-ref-palette-neutral-variant98:  #F8FAFD;\n  --md-ref-palette-neutral-variant99:  #FCFDFF;\n  --md-ref-palette-neutral-variant100: #FFFFFF;\n\n  /* ────────────────────────────────────────────────────────\n     sys.color · LIGHT (M3 default)\n     ──────────────────────────────────────────────────────── */\n  --md-sys-color-primary:                       #000000;\n  --md-sys-color-on-primary:                    #FFFFFF;\n  --md-sys-color-primary-container:             var(--md-ref-palette-neutral90);\n  --md-sys-color-on-primary-container:          #000000;\n  --md-sys-color-inverse-primary:               #FFFFFF;\n  --md-sys-color-primary-fixed:                 var(--md-ref-palette-primary90);\n  --md-sys-color-primary-fixed-dim:             var(--md-ref-palette-primary80);\n  --md-sys-color-on-primary-fixed:              var(--md-ref-palette-primary10);\n  --md-sys-color-on-primary-fixed-variant:      var(--md-ref-palette-primary30);\n\n  --md-sys-color-secondary:                     var(--md-ref-palette-secondary40);\n  --md-sys-color-on-secondary:                  var(--md-ref-palette-secondary100);\n  --md-sys-color-secondary-container:           var(--md-ref-palette-secondary90);\n  --md-sys-color-on-secondary-container:        var(--md-ref-palette-secondary10);\n  --md-sys-color-secondary-fixed:               var(--md-ref-palette-secondary90);\n  --md-sys-color-secondary-fixed-dim:           var(--md-ref-palette-secondary80);\n  --md-sys-color-on-secondary-fixed:            var(--md-ref-palette-secondary10);\n  --md-sys-color-on-secondary-fixed-variant:    var(--md-ref-palette-secondary30);\n\n  /* tertiary removed — JOOLA is a two-accent system (primary black +\n     secondary blue). Use secondary or a *-container role for accents. */\n\n  --md-sys-color-error:                         var(--md-ref-palette-error40);\n  --md-sys-color-on-error:                      var(--md-ref-palette-error100);\n  --md-sys-color-error-container:               var(--md-ref-palette-error90);\n  --md-sys-color-on-error-container:            var(--md-ref-palette-error10);\n\n  --md-sys-color-success:                       var(--md-ref-palette-success40);\n  --md-sys-color-on-success:                    var(--md-ref-palette-success100);\n  --md-sys-color-success-container:             var(--md-ref-palette-success90);\n  --md-sys-color-on-success-container:          var(--md-ref-palette-success10);\n\n  --md-sys-color-warning:                       var(--md-ref-palette-warning40);\n  --md-sys-color-on-warning:                    var(--md-ref-palette-warning100);\n  --md-sys-color-warning-container:             var(--md-ref-palette-warning90);\n  --md-sys-color-on-warning-container:          var(--md-ref-palette-warning10);\n\n  --md-sys-color-background:                    var(--md-ref-palette-neutral98);\n  --md-sys-color-on-background:                 var(--md-ref-palette-neutral10);\n\n  --md-sys-color-surface:                       var(--md-ref-palette-neutral98);\n  --md-sys-color-on-surface:                    var(--md-ref-palette-neutral10);\n  --md-sys-color-surface-variant:               var(--md-ref-palette-neutral-variant90);\n  --md-sys-color-on-surface-variant:            var(--md-ref-palette-neutral-variant30);\n  --md-sys-color-inverse-surface:               var(--md-ref-palette-neutral20);\n  --md-sys-color-inverse-on-surface:            var(--md-ref-palette-neutral95);\n\n  --md-sys-color-surface-dim:                   var(--md-ref-palette-neutral87);\n  --md-sys-color-surface-bright:                var(--md-ref-palette-neutral98);\n  --md-sys-color-surface-container-lowest:      var(--md-ref-palette-neutral100);\n  --md-sys-color-surface-container-low:         var(--md-ref-palette-neutral96);\n  --md-sys-color-surface-container:             var(--md-ref-palette-neutral94);\n  --md-sys-color-surface-container-high:        var(--md-ref-palette-neutral92);\n  --md-sys-color-surface-container-highest:     var(--md-ref-palette-neutral90);\n  --md-sys-color-surface-tint:                  var(--md-sys-color-primary);\n\n  --md-sys-color-outline:                       var(--md-ref-palette-neutral-variant50);\n  --md-sys-color-outline-variant:               var(--md-ref-palette-neutral-variant80);\n  --md-sys-color-shadow:                        var(--md-ref-palette-neutral0);\n  --md-sys-color-scrim:                         var(--md-ref-palette-neutral0);\n\n  /* ────────────────────────────────────────────────────────\n     sys.typescale  ·  FK Grotesk Neue\n     M3 standard scale. Weights: regular default, medium for\n     title-m/s + all labels. Emphasized = bold (headline-m → black).\n     ──────────────────────────────────────────────────────── */\n  --md-sys-typescale-font-brand:  \"FK Grotesk Neue\", \"FK Grotesk\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --md-sys-typescale-font-plain:  var(--md-sys-typescale-font-brand);\n  --md-sys-typescale-font-mono:   \"FK Grotesk Mono\", \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  --md-sys-typescale-weight-regular: 400;\n  --md-sys-typescale-weight-medium:  500;\n  --md-sys-typescale-weight-bold:    700;\n  --md-sys-typescale-weight-black:   900;\n\n  /* Display */\n  --md-sys-typescale-display-large-size:        57px;\n  --md-sys-typescale-display-large-line-height: 64px;\n  --md-sys-typescale-display-large-tracking:   -0.25px;\n  --md-sys-typescale-display-medium-size:        45px;\n  --md-sys-typescale-display-medium-line-height: 52px;\n  --md-sys-typescale-display-medium-tracking:    0px;\n  --md-sys-typescale-display-small-size:         36px;\n  --md-sys-typescale-display-small-line-height:  44px;\n  --md-sys-typescale-display-small-tracking:     0px;\n\n  /* Headline */\n  --md-sys-typescale-headline-large-size:        32px;\n  --md-sys-typescale-headline-large-line-height: 40px;\n  --md-sys-typescale-headline-large-tracking:    0px;\n  --md-sys-typescale-headline-medium-size:        28px;\n  --md-sys-typescale-headline-medium-line-height: 36px;\n  --md-sys-typescale-headline-medium-tracking:    0px;\n  --md-sys-typescale-headline-small-size:         24px;\n  --md-sys-typescale-headline-small-line-height:  32px;\n  --md-sys-typescale-headline-small-tracking:     0px;\n\n  /* Title */\n  --md-sys-typescale-title-large-size:        22px;\n  --md-sys-typescale-title-large-line-height: 28px;\n  --md-sys-typescale-title-large-tracking:    0px;\n  --md-sys-typescale-title-medium-size:        16px;\n  --md-sys-typescale-title-medium-line-height: 24px;\n  --md-sys-typescale-title-medium-tracking:    0.15px;\n  --md-sys-typescale-title-small-size:         14px;\n  --md-sys-typescale-title-small-line-height:  20px;\n  --md-sys-typescale-title-small-tracking:     0.1px;\n\n  /* Body */\n  --md-sys-typescale-body-large-size:        16px;\n  --md-sys-typescale-body-large-line-height: 24px;\n  --md-sys-typescale-body-large-tracking:    0.5px;\n  --md-sys-typescale-body-medium-size:        14px;\n  --md-sys-typescale-body-medium-line-height: 20px;\n  --md-sys-typescale-body-medium-tracking:    0.25px;\n  --md-sys-typescale-body-small-size:         12px;\n  --md-sys-typescale-body-small-line-height:  16px;\n  --md-sys-typescale-body-small-tracking:     0.4px;\n\n  /* Label */\n  --md-sys-typescale-label-large-size:        14px;\n  --md-sys-typescale-label-large-line-height: 20px;\n  --md-sys-typescale-label-large-tracking:    0.1px;\n  --md-sys-typescale-label-medium-size:        12px;\n  --md-sys-typescale-label-medium-line-height: 16px;\n  --md-sys-typescale-label-medium-tracking:    0.5px;\n  --md-sys-typescale-label-small-size:         11px;\n  --md-sys-typescale-label-small-line-height:  16px;\n  --md-sys-typescale-label-small-tracking:     0.5px;\n\n  /* ────────────────────────────────────────────────────────\n     sys.shape · corner sizes\n     ──────────────────────────────────────────────────────── */\n  --md-sys-shape-corner-none:                       0;\n  --md-sys-shape-corner-extra-small:                4px;\n  --md-sys-shape-corner-extra-small-top:            4px 4px 0 0;\n  --md-sys-shape-corner-small:                      8px;\n  --md-sys-shape-corner-medium:                     12px;\n  --md-sys-shape-corner-large:                      16px;\n  --md-sys-shape-corner-large-end:                  0 16px 16px 0;\n  --md-sys-shape-corner-large-top:                  16px 16px 0 0;\n  --md-sys-shape-corner-extra-large:                28px;\n  --md-sys-shape-corner-extra-large-top:            28px 28px 0 0;\n  --md-sys-shape-corner-full:                       9999px;\n\n  /* ────────────────────────────────────────────────────────\n     sys.elevation · 6 levels (M3 spec, key + ambient shadow)\n     ──────────────────────────────────────────────────────── */\n  --md-sys-elevation-level0: none;\n  --md-sys-elevation-level1: 0 1px 2px 0 rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);\n  --md-sys-elevation-level2: 0 1px 2px 0 rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);\n  --md-sys-elevation-level3: 0 1px 3px 0 rgba(0,0,0,.30), 0 4px 8px 3px rgba(0,0,0,.15);\n  --md-sys-elevation-level4: 0 2px 3px 0 rgba(0,0,0,.30), 0 6px 10px 4px rgba(0,0,0,.15);\n  --md-sys-elevation-level5: 0 4px 4px 0 rgba(0,0,0,.30), 0 8px 12px 6px rgba(0,0,0,.15);\n\n  /* ────────────────────────────────────────────────────────\n     sys.state · state-layer opacities (M3 spec values)\n     ──────────────────────────────────────────────────────── */\n  --md-sys-state-hover-state-layer-opacity:    0.08;\n  --md-sys-state-focus-state-layer-opacity:    0.10;\n  --md-sys-state-pressed-state-layer-opacity:  0.10;\n  --md-sys-state-dragged-state-layer-opacity:  0.16;\n\n  /* Disabled content/container opacities (M3 spec) */\n  --md-sys-state-disabled-content-opacity:   0.38;\n  --md-sys-state-disabled-container-opacity: 0.12;\n\n  /* ────────────────────────────────────────────────────────\n     sys.motion · durations + easings (M3 spec)\n     ──────────────────────────────────────────────────────── */\n  --md-sys-motion-duration-short1:        50ms;\n  --md-sys-motion-duration-short2:        100ms;\n  --md-sys-motion-duration-short3:        150ms;\n  --md-sys-motion-duration-short4:        200ms;\n  --md-sys-motion-duration-medium1:       250ms;\n  --md-sys-motion-duration-medium2:       300ms;\n  --md-sys-motion-duration-medium3:       350ms;\n  --md-sys-motion-duration-medium4:       400ms;\n  --md-sys-motion-duration-long1:         450ms;\n  --md-sys-motion-duration-long2:         500ms;\n  --md-sys-motion-duration-long3:         550ms;\n  --md-sys-motion-duration-long4:         600ms;\n  --md-sys-motion-duration-extra-long1:   700ms;\n  --md-sys-motion-duration-extra-long2:   800ms;\n  --md-sys-motion-duration-extra-long3:   900ms;\n  --md-sys-motion-duration-extra-long4:   1000ms;\n\n  --md-sys-motion-easing-linear:                  cubic-bezier(0, 0, 1, 1);\n  --md-sys-motion-easing-standard:                cubic-bezier(0.2, 0, 0, 1);\n  --md-sys-motion-easing-standard-accelerate:     cubic-bezier(0.3, 0, 1, 1);\n  --md-sys-motion-easing-standard-decelerate:     cubic-bezier(0, 0, 0, 1);\n  --md-sys-motion-easing-emphasized:              cubic-bezier(0.2, 0, 0, 1);\n  --md-sys-motion-easing-emphasized-accelerate:   cubic-bezier(0.3, 0, 0.8, 0.15);\n  --md-sys-motion-easing-emphasized-decelerate:   cubic-bezier(0.05, 0.7, 0.1, 1);\n\n  /* ────────────────────────────────────────────────────────\n     Legacy aliases · keep older JOOLA token names working\n     so previously-built preview cards still inherit the M3\n     brand font + colors instead of falling back to\n     system-default sans-serif.\n     ──────────────────────────────────────────────────────── */\n  --font-brand:    var(--md-sys-typescale-font-brand);\n  --font-sans:     var(--md-sys-typescale-font-brand);\n  --font-display:  var(--md-sys-typescale-font-brand);\n  --font-plain:    var(--md-sys-typescale-font-brand);\n  --font-mono:     var(--md-sys-typescale-font-mono);\n  --font-mono-brand: var(--md-sys-typescale-font-mono);\n\n  --bg-1:        var(--md-sys-color-surface);\n  --bg-2:        var(--md-sys-color-surface-container);\n  --bg-3:        var(--md-sys-color-surface-container-high);\n  --bg-inverse:  var(--md-sys-color-inverse-surface);\n\n  --fg-1:        var(--md-sys-color-on-surface);\n  --fg-2:        var(--md-sys-color-on-surface);\n  --fg-3:        var(--md-sys-color-on-surface-variant);\n  --fg-4:        var(--md-sys-color-outline);\n  --fg-inverse:  var(--md-sys-color-inverse-on-surface);\n\n  --border-1:    var(--md-sys-color-outline-variant);\n  --border-2:    var(--md-sys-color-outline);\n  --border-strong: var(--md-sys-color-on-surface);\n\n  --accent:        var(--md-sys-color-primary);\n  --accent-hover:  var(--md-sys-color-on-primary-container);\n  --accent-on:     var(--md-sys-color-on-primary);\n\n  /* JOOLA brand chromatic constants — explicit hex so the\n     'Brand' preview cards (logos, accents, trinity symbol)\n     render with their intended colors regardless of theme. */\n  --joola-black:       #000000;\n  --joola-ink:         #1A1B1C;\n  --joola-graphite:    #303133;\n  --joola-stone:       #5F6062;\n  --joola-mist:        #ACADAF;\n  --joola-fog:         #E3E5E6;\n  --joola-paper:       #F1F3F4;\n  --joola-white:       #FFFFFF;\n  --joola-yellow:      #EFE158;\n  --joola-yellow-deep: #B6A926;\n  --joola-yellow-soft: #FAF3CA;\n  --joola-red:         #DC362E;\n  --joola-court-blue:  #2D3034;\n  --joola-sky:         #5B5E62;\n  --joola-court-green: #51664D;\n}\n\n/* ────────────────────────────────────────────────────────\n   sys.color · DARK\n   Apply by adding `.theme-dark` (or `[data-theme=\"dark\"]`)\n   to <html> / <body>.\n   ──────────────────────────────────────────────────────── */\n.theme-dark, [data-theme=\"dark\"] {\n  --md-sys-color-primary:                       #FFFFFF;\n  --md-sys-color-on-primary:                    #000000;\n  --md-sys-color-primary-container:             var(--md-ref-palette-neutral22);\n  --md-sys-color-on-primary-container:          #FFFFFF;\n  --md-sys-color-inverse-primary:               #000000;\n\n  --md-sys-color-secondary:                     var(--md-ref-palette-secondary80);\n  --md-sys-color-on-secondary:                  var(--md-ref-palette-secondary20);\n  --md-sys-color-secondary-container:           var(--md-ref-palette-secondary30);\n  --md-sys-color-on-secondary-container:        var(--md-ref-palette-secondary90);\n\n  /* tertiary removed — see light theme note */\n\n  --md-sys-color-error:                         var(--md-ref-palette-error80);\n  --md-sys-color-on-error:                      var(--md-ref-palette-error20);\n  --md-sys-color-error-container:               var(--md-ref-palette-error30);\n  --md-sys-color-on-error-container:            var(--md-ref-palette-error90);\n\n  --md-sys-color-success:                       var(--md-ref-palette-success80);\n  --md-sys-color-on-success:                    var(--md-ref-palette-success20);\n  --md-sys-color-success-container:             var(--md-ref-palette-success30);\n  --md-sys-color-on-success-container:          var(--md-ref-palette-success90);\n\n  --md-sys-color-warning:                       var(--md-ref-palette-warning80);\n  --md-sys-color-on-warning:                    var(--md-ref-palette-warning20);\n  --md-sys-color-warning-container:             var(--md-ref-palette-warning30);\n  --md-sys-color-on-warning-container:          var(--md-ref-palette-warning90);\n\n  --md-sys-color-background:                    var(--md-ref-palette-neutral6);\n  --md-sys-color-on-background:                 var(--md-ref-palette-neutral90);\n\n  --md-sys-color-surface:                       var(--md-ref-palette-neutral6);\n  --md-sys-color-on-surface:                    var(--md-ref-palette-neutral90);\n  --md-sys-color-surface-variant:               var(--md-ref-palette-neutral-variant30);\n  --md-sys-color-on-surface-variant:            var(--md-ref-palette-neutral-variant80);\n  --md-sys-color-inverse-surface:               var(--md-ref-palette-neutral90);\n  --md-sys-color-inverse-on-surface:            var(--md-ref-palette-neutral20);\n\n  --md-sys-color-surface-dim:                   var(--md-ref-palette-neutral6);\n  --md-sys-color-surface-bright:                var(--md-ref-palette-neutral24);\n  --md-sys-color-surface-container-lowest:      var(--md-ref-palette-neutral4);\n  --md-sys-color-surface-container-low:         var(--md-ref-palette-neutral10);\n  --md-sys-color-surface-container:             var(--md-ref-palette-neutral12);\n  --md-sys-color-surface-container-high:        var(--md-ref-palette-neutral17);\n  --md-sys-color-surface-container-highest:     var(--md-ref-palette-neutral22);\n\n  --md-sys-color-outline:                       var(--md-ref-palette-neutral-variant60);\n  --md-sys-color-outline-variant:               var(--md-ref-palette-neutral-variant30);\n}\n\n/* ────────────────────────────────────────────────────────\n   Sensible page defaults bound to the M3 surface roles\n   ──────────────────────────────────────────────────────── */\nhtml { color-scheme: light; }\nhtml.theme-dark, html[data-theme=\"dark\"] { color-scheme: dark; }\nbody {\n  background: var(--md-sys-color-background);\n  color: var(--md-sys-color-on-background);\n  font-family: var(--md-sys-typescale-font-brand);\n  margin: 0;\n}\n\n::selection {\n  background: var(--md-sys-color-primary-container);\n  color: var(--md-sys-color-on-primary-container);\n}\n\n/* ────────────────────────────────────────────────────────\n   BRAND EXPRESSION LAYER (extra · outside the M3 scheme)\n   ------------------------------------------------------\n   Heritage JOOLA brand colors. They aren't part of any\n   md.sys.color role — keep them for logos, the trinity\n   symbol, and product/marketing surfaces that want raw\n   brand identity. Don't reach for these in app UI; use the\n   M3 roles above.\n   ──────────────────────────────────────────────────────── */\n:root {\n  --joola-black:        #0A0A0A;\n  --joola-ink:          #1E1E1E;\n  --joola-graphite:     #3A3A3A;\n  --joola-stone:        #6B6B6B;\n  --joola-mist:         #B8B8B8;\n  --joola-fog:          #E5E5E5;\n  --joola-paper:        #F5F4F1;\n  --joola-white:        #FFFFFF;\n\n  --joola-yellow:       #F5E625;\n  --joola-yellow-deep:  #D9CB1F;\n  --joola-yellow-soft:  #FFF4A8;\n  --joola-red:          #D6182A;\n  --joola-red-deep:     #A30E1E;\n  --joola-court-blue:   #0B2A4A;\n  --joola-sky:          #2C7AD6;\n  --joola-court-green:  #2E7D5B;\n\n  /* Legacy aliases — older brand cards reference these */\n  --bg-1: var(--md-sys-color-surface);\n  --bg-2: var(--md-sys-color-surface-container-low);\n  --fg-3: var(--md-sys-color-on-surface-variant);\n  --fg-4: var(--md-sys-color-outline);\n  --border-1: var(--md-sys-color-outline-variant);\n  --font-sans: var(--md-sys-typescale-font-brand);\n  --font-mono: var(--md-sys-typescale-font-mono);\n}\n<\u002Fstyle>\n  <script src=\"ff6a98ff-c9ac-49b9-b442- ent(closest-side,rgba(214,24,42,.30),transparent 70%);filter:blur(20px);z-index:0;animation:psGlow 6s ease-in-out infinite;\"><\u002Fdiv>\n\n    <div style=\"position:relative;z-index:1;width:392px;padding:13px;border-radius:60px;background:linear-gradient(155deg,#3a3a40 0%,#161618 28%,#0a0a0b 70%,#202024 100%);box-shadow:0 60px 120px -28px rgba(0,0,0,.85),0 30px 60px -34px rgba(0,0,0,.9),inset 0 0 0 1.5px rgba(255,255,255,.05),inset 0 2px 1px rgba(255,255,255,.16),inset 0 -3px 3px rgba(0,0,0,.7);\">\n\n      <div style=\"position:relative;width:366px;height:788px;border-radius:47px;overflow:hidden;background:linear-gradient(180deg,#0c0c0f 0%,#08080a 100%);box-shadow:inset 0 0 0 2px #000;display:flex;flex-direction:column;\">\n\n        <!-- dynamic island -->\n        <div style=\"position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:32px;background:#000;border-radius:18px;z-index:30;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;\">\n          <div style=\"width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#23303a,#070b0e);box-shadow:inset 0 0 2px rgba(90,150,200,.5);\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- status bar -->\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:15px 26px 0;height:50px;flex:none;color:#fff;z-index:20;\">\n          <span style=\"font-size:14px;font-weight:600;letter-spacing:.02em;\">9:41<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px;\">\n            <svg width=\"18\" height=\"12\" viewBox=\"0 0 18 12\" fill=\"#fff\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"5\" rx=\"1\"><\u002Frect><rect x=\"5\" y=\"4.5\" width=\"3\" height=\"7.5\" rx=\"1\"><\u002Frect><rect x=\"10\" y=\"2\" width=\"3\" height=\"10\" rx=\"1\"><\u002Frect><rect x=\"15\" y=\"0\" width=\"3\" height=\"12\" rx=\"1\"><\u002Frect><\u002Fsvg>\n            <svg width=\"17\" height=\"12\" viewBox=\"0 0 17 13\" x:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;\">\n              <div style=\"font-family:var(--md-sys-typescale-font-mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#7C7D81;\">JOOLA Coach<\u002Fdiv>\n              <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:13px;font-weight:600;color:#fff;letter-spacing:.01em;\">{{ progressLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hideProgress }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:13px;font-weight:600;color:#fff;letter-spacing:.01em;\">{{ subtitleLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ restartVisible }}\" hint-placeholder-val=\"{{ false }}\">\n              <button onclick=\"{{ onAskRestart }}\" aria-label=\"Restart the paddle selector\" style=\"width:38px;height:38px;flex:none;border:none;border-radius:50%;background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;\" style-hover=\"background:rgba(255,255,255,.13);\">\n                <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ restartHidden }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:38px;height:38px;flex:none;\"><\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <!-- progress track -->\n          <sc-if value=\"{{ showProgress }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"height:4px;width:100%;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px;\">{{ progressFill }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- SCROLL AREA -->\n        <div ref=\"{{ chatRef }}\" class=\"ps-scroll\" style=\"flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:12px;padding:16px 16px 10px;\">\n\n          <!-- CHAT VIEW -->\n          <sc-if value=\"{{ isChatView }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <sc-if value=\"{{ m.isAssistant }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;gap:9px;align-items:flex-end;max-width:88%;animation:psBubble .42s cubic-bezier(0.05,0.7,0.1,1) both;\">\n                  <div style=\"width:30px;height:30px;flex:none;border-radius:9px;background:radial-gradient(circle at 38% 28%,#34343a,#161619);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);\">\n                    <img src=\"0140f2cd-fa8c-4fb0-8227-a59cfad93691\" alt=\"\" style=\"width:18px;height:auto;\">\n                  <\u002Fdiv>\n                  <div style=\"background:#1b1b20;border:1px solid rgba(255,255,255,.07);color:#ECECEE;padding:11px 14px;border-radius:16px 16px 16px 5px;box-shadow:0 8px 20px rgba(0,0,0,.4);\">\n                    <sc-if value=\"{{ m.eyebrow }}\" hint-placeholder-val=\"cat\">\n                      <div style=\"font-family:var(--md-sys-typescale-font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#ff6b6b;margin-bottom:5px;\">{{ m.eyebrow }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"font-size:15px;line-height:1.42;font-weight:500;\">{{ m.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ m.isUser }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"align-self:flex er;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 10px 22px rgba(176,13,28,.4);\">\n                    <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                    {{ o.label }}\n                  <\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ o.unselected }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button onclick=\"{{ o.pick }}\" style=\"flex:1 1 132px;min-height:52px;border:1.5px solid rgba(255,255,255,.12);background:#16161a;color:#ECECEE;font-family:var(--md-sys-typescale-font-brand);font-size:14.5px;font-weight:600;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:8px 12px;text-align:center;\" style-hover=\"border-color:rgba(224,32,47,.7);background:rgba(224,32,47,.12);color:#fff;\" style-active=\"transform:scale(.97);\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- typing dock hint -->\n          <sc-if value=\"{{ typing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;font-size:12px;color:#6f7074;padding:13px 0;letter-spacing:.02em;\">Coach is finding your match…<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- error retry -->\n          <sc-if value=\"{{ errored }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ onRetry }}\" style=\"width:100%;border:none;background:linear-gradient(135deg,#e0202f,#b00d1c);color:#fff;font-family:var(--md-sys-typescale-font-brand);font-size:15px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer;box-shadow:0 12px 26px -8px rgba(214,24,42,.5);display:flex;align-items:center;justify-content:center;gap:8px;\" style-hover=\"filter:brightness(1.08);\">\n              <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>\n              Retry\n            <\u002Fbutton>\n          <\u002Fsc-if>\n\n          <!-- results actions -->\n          <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <button onclick=\"{{ onAskRestart }}\" style=\"width:100%;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#fff;font-family:var(--md-sys-typescale-font-brand);font-size:15px;font-weight:600;padding:15px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;\" style-hover=\"background:rgba(255,255,255,.1);\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>\n              Start over\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- RESTART OVERLAY -->\n        <sc-if value=\"{{ showRestartOverlay }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;\">\n            <div onclick=\"{{ onCancelOverlay }}\" style=\"position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);animation:psScrim .25s ease both;\"><\u002Fdiv>\n            <div style=\"position:relative;background:#161619;border-radius:26px 26px 47px 47px;padding:24px 22px 30px;border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -20px 40px rgba(0,0,0,.5);animation:psSheet .35s cubic-bezier(0.05,0.7,0.1,1) both;\">\n              <div style=\"width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);margin:0 auto 18px;\"><\u002Fdiv>\n              <div style=\"font-size:20px;font-weight:800;color:#fff;text-align:center;margin-bottom:8px;\">Start over?<\u002Fdiv>\n              <div style=\"font-size:14px;color:#9A9B9F;text-align:center;line-height:1.45;margin-bottom:22px;\">This clears your answers and takes you back to the first question.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;\">\n                <button onclick=\"{{ onConfirmRestart }}\" style=\"width:100%;border:none;background:linear-gradient(135deg,#e0202f,#b00d1c);color:#fff;font-family:var(--md-sys-typescale-font-brand);font-size:15px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer;box-shadow:0 12px 26px -8px rgba(214,24,42,.5);\" style-hover=\"filter:brightness(1.08);\">Yes, restart<\u002Fbutton>\n                <button onclick=\"{{ onCancelOverlay }}\" style=\"width:100%;border:1.5px solid rgba(255,255,255,.16);background:transparent;color:#fff;font-family:var(--md-sys-typescale-font-brand);font-size:15px;font-weight:600;padding:15px;border-radius:14px;cursor:pointer;\" style-hover=\"background:rgba(255,255,255,.08);\">Keep my answers<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ───────── STATE PREVIEW SWITCHER ───────── -->\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;max-width:430px;\">\n    <div style=\"font-family:var(--md-sys-typescale-font-mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#5f6064;\">Preview states<\u002Fdiv>\n    {{ demoSwitcher }}\n  <\u002Fdiv>\n\n  <!-- ───────── DESKTOP NOTE ───────── -->\n  <div style=\"width:100%;max-width:940px;display:flex;flex-direction:column;gap:14px;margin-top:14px;\">\n    <div style=\"display:flex;align-items:center;gap:10px;\">\n      <div style=\"font-family:var(--md-sys-typescale-font-mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#7C7D81;\">Desktop adaptation<\u002Fdiv>\n      <div style=\"flex:1;height:1px;background:rgba(255,255,255,.08);\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 40px 80px -30px rgba(0,0,0,.7);\">\n      <div style=\"height:38px;background:#1a1a1d;display:flex;align-items:center;gap:7px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.06);\">\n        <span style=\"width:11px;height:11px;border-radius:50%;background:#ff5f57;\"><\u002Fspan>\n        <span style=\"width:11px;height:11px;border-radius:50%;background:#febc2e;\"><\u002Fspan>\n        <span style=\"width:11px;height:11px;border-radius:50%;background:#28c840;\"><\u002Fspan>\n        <span style=\"margin-left:14px;font-family:var(--md-sys-typescale-font-mono);font-size:11px;color:#6f7074;\">joola.com/paddle-selector<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1.1fr;background:linear-gradient(135deg,#0e0e10,#070708);min-height:360px;\">\n        <!-- intro rail -->\n        <div style=\"padding:42px 38px;display:flex;flex-direction:column;justify-content:center;gap:18px;border-right:1px solid rgba(255,255,255,.05);\">\n          <img src=\"911e22ce-22a0-48b5-9b75-14a6a3632306\" alt=\"JOOLA\" style=\"height:22px;width:auto;filter:invert(1);align-self:flex-start;\">\n          <div style=\"font-size:34px;font-weight:800;line-height:1.08;color:#fff;letter-spacing:-.02em;\">Find your<br>JOOLA paddle.<\u002Fdiv>\n          <div style=\"font-size:15px;color:#9A9B9F;line-height:1.5;max-width:300px;\">Answer a few quick questions and get a personalized recommendation built around your game.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;margin-top:4px;\">\n            <span style=\"font-family:var(--md-sys-typescale-font-mono);font-size:11px;color:#ff5a5a;letter-spacing:.1em;\">7 QUESTIONS<\u002Fspan>\n            <span style=\"width:4px;height:4px;border-radius:50%;background:#444;\"><\u002Fspan>\n            <span style=\"font-family:var(--md-sys-typescale-font-mono);font-size:11px;color:#6f7074;letter-spacing:.1em;\">~30 SEC<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- centered chat container -->\n        <div style=\"padding:34px;display:flex;align-items:center;justify-content:center;\">\n          <div style=\"width:100%;max-width:380px;background:#0c0c0f;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;box-shadow:0 30px 60px -24px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:12px;\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n              <div style=\"font-family:var(--md-sys-typescale-font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#7C7D81;\">Question 3 of 7<\u002Fdiv>\n              <div style=\"font-family:var(--md-sys-typescale-font-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5f6064;\">Restart<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;\"><div style=\"height:100%;width:43%;background:linear-gradient(90deg,#e0202f,#ff5a5a);border-radius:99px;\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;align-items:flex-end;max-width:90%;\">\n              <div style=\"width:28px;height:28px;flex:none;border-radius:8px;background:radial-gradient(circle at 38% 28%,#34343a,#161619);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);\"><img src=\"0140f2cd-fa8c-4fb0-8227-a59cfad93691\" alt=\"\" style=\"width:16px;height:auto;\"><\u002Fdiv>\n              <div style=\"background:#1b1b20;border:1px solid rgba(255,255,255,.07);color:#ECECEE;padding:10px 13px;border-radius:14px 14px 14px 4px;font-size:14px;font-weight:500;\">When you play, what matters most?<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;\">\n              <span style=\"flex:1 1 46%;text-align:center;border:1.5px solid rgba(255,255,255,.12);background:#16161a;color:#ECECEE;font-size:13.5px;font-weight:600;border-radius:12px;padding:11px;\">Power<\u002Fspan>\n              <span style=\"flex:1 1 46%;text-align:center;border:1.5px solid #e0202f;background:linear-gradient(135deg,#e0202f,#b00d1c);color:#fff;font-size:13.5px;font-weight:600;border-radius:12px;padding:11px;\">Control<\u002Fspan>\n              <span style=\"flex:1 1 46%;text-align:center;border:1.5px solid rgba(255,255,255,.12);background:#16161a;color:#ECECEE;font-size:13.5px;font-weight:600;border-radius:12px;padding:11px;\">Balance<\u002Fspan>\n              <span style=\"flex:1 1 46%;text-align:center;border:1.5px solid rgba(255,255,255,.12);background:#16161a;color:#ECECEE;font-size:13.5px;font-weight:600;border-radius:12px;padding:11px;\">Spin<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px;color:#6f7074;line-height:1.5;\">Desktop keeps the same chat engine inside a centered container, with a persistent intro rail on the left. Results expand to a 2-up row of top cards with the \"other paddles\" grid below. The mobile phone above is the interactive source of truth.<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.chatRef = React.createRef();\n    this.timers = [];\n    this.QUESTIONS = [\n      {cat:'Player Profile',     q:\"First up — what's your skill level?\",          options:['Beginner','Intermediate','Advanced']},\n      {cat:'Player Profile',     q:\"How often do you get on the court?\",           options:['Occasionally','Weekly','Multiple times / week']},\n      {cat:'Play Style',         q:\"When you play, what matters most?\",            options:['Power','Control','Balance','Spin']},\n      {cat:'Feel & Comfort',     q:\"Do you use a two-handed backhand?\",            options:['Yes','No','Sometimes']},\n      {cat:'Price Sensitivity',  q:\"What's your budget?\",                          options:['Under $100','$100–$200','$200+ premium','No budget']},\n      {cat:'Price Sensitivity',  q:\"Open to upgrading if it improves your game?\",  options:['Yes','Maybe','No']},\n      {cat:'Grip Circumference', q:\"How does your current grip feel?\",             options:['Small','Just right','Large','Not sure / 1st paddle']}\n    ];\n    this.WELCOME = \"Let's find the right JOOLA paddle for your game. I'll ask 7 quick questions — tap your answer and I'll handle the rest.\";\n    this.OTHERS = [\n      {name:'Paddle C', eyebrow:'All-Court · 16mm', tag:'Balance', price:'$129.95'},\n      {name:'Paddle D', eyebrow:'Power · 14mm',     tag:'Power',   price:'$219.95'},\n      {name:'Paddle E', eyebrow:'Control · 16mm',   tag:'Spin',    price:'$149.95'},\n      {name:'Paddle F', eyebrow:'Entry · 13mm',     tag:'Value',   price:'$99.95'}\n    ];\n  }\n\n  state = {\n    phase: 'welcome',   // welcome | chat | results\n    step: 0,\n    answers: [],\n    typing: false,\n    pendingPick: null,\n    overlay: null,      // null | 'restart'\n    errored: false,\n    resultMode: 'match' // match | nomatch\n  };\n\n  later(fn, ms){ const t = setTimeout(fn, ms); this.timers.push(t); return t; }\n  clearTimers(){ this.timers.forEach(t => clearTimeout(t)); this.timers = []; }\n  componentWillUnmount(){ this.clearTimers(); }\n  componentDidUpdate(){ const el = this.chatRef.current; if (el) el.scrollTop = el.scrollHeight; }\n\n  start(){\n    this.clearTimers();\n    this.setState({phase:'chat', step:0, answers:[], typing:true, pendingPick:null, errored:false, overlay:null, resultMode:'match'});\n    this.later(() => this.setState({typing:false}), 850);\n  }\n\n  select(opt){\n    if (this.state.pendingPick) return;\n    this.setState({pendingPick:opt});\n    this.later(() => {\n      const answers = this.state.answers.slice(0, this.state.step);\n      answers[this.state.step] = opt;\n      const nextStep = this.state.step + 1;\n      this.setState({answers, step:nextStep, typing:true, pendingPick:null});\n      this.later(() => {\n        if (nextStep >= this.QUESTIONS.length) this.setState({phase:'results', typing:false});\n        else this.setState({typing:false});\n      }, 980);\n    }, 270);\n  }\n\n  changeLast(){\n    this.clearTimers();\n    if (this.state.phase === 'results'){\n      const step = this.QUESTIONS.length - 1;\n      this.setState({phase:'chat', step, answers:this.state.answers.slice(0, step), typing:false, pendingPick:null});\n      return;\n    }\n    if (this.state.step > 0){\n      const step = this.state.step - 1;\n      this.setState({step, answers:this.state.answers.slice(0, step), typing:false, pendingPick:null});\n    }\n  }\n\n  askRestart(){ this.setState({overlay:'restart'}); }\n  cancelOverlay(){ this.setState({overlay:null}); }\n  confirmRestart(){ this.clearTimers(); this.setState({phase:'welcome', step:0, answers:[], typing:false, pendingPick:null, overlay:null, errored:false, resultMode:'match'}); }\n  retry(){ this.setState({errored:false}); }\n\n  setDemo(name){\n    this.clearTimers();\n    const full = ['Intermediate','Weekly','Control','Sometimes','$100–$200','Maybe','Just right'];\n    const base = {overlay:null, errored:false, pendingPick:null, resultMode:'match'};\n    switch(name){\n      case 'welcome':  this.setState({...base, phase:'welcome', step:0, answers:[], typing:false}); break;\n      case 'question': this.setState({...base, phase:'chat', step:2, answers:full.slice(0,2), typing:false}); break;\n      case 'selected': this.setState({...base, phase:'chat', step:2, answers:full.slice(0,2), typing:false, pendingPick:'Control'}); break;\n      case 'loading':  this.setState({...base, phase:'chat', step:3, answers:full.slice(0,3), typing:true}); break;\n      case 'results':  this.setState({...base, phase:'results', step:7, answers:full, typing:false}); break;\n      case 'nomatch':  this.setState({...base, phase:'results', step:7, answers:full, typing:false, resultMode:'nomatch'}); break;\n      case 'error':    this.setState({...base, phase:'chat', step:3, answers:full.slice(0,3), typing:false, errored:true}); break;\n      case 'restart':  this.setState({...base, phase:'chat', step:3, answers:full.slice(0,3), typing:false, overlay:'restart'}); break;\n    }\n  }\n\n  renderVals(){\n    const { phase, step, answers, typing, pendingPick, overlay, errored, resultMode } = this.state;\n    const Q = this.QUESTIONS;\n    const total = Q.length;\n\n    const messages = [];\n    messages.push({id:'w', isAssistant:true, isUser:false, eyebrow:'', text:this.WELCOME});\n    for (let i = 0; i < answers.length; i++){\n      messages.push({id:'q'+i, isAssistant:true, isUser:false, eyebrow:Q[i].cat, text:Q[i].q});\n      messages.push({id:'a'+i, isAssistant:false, isUser:true, eyebrow:'', text:answers[i]});\n    }\n    const showCurrentQ = phase === 'chat' && !typing && !errored && step < total;\n    if (showCurrentQ) messages.push({id:'cur', isAssistant:true, isUser:false, eyebrow:Q[step].cat, text:Q[step].q});\n\n    const options = (phase === 'chat' && step < total ? Q[step].options : []).map((label, i) => ({\n      label, idx:i,\n      selected: label === pendingPick,\n      unselected: label !== pendingPick,\n      pick: () => this.select(label)\n    }));\n\n    const lvl = (answers[0] || 'Intermediate').toLowerCase();\n    const pr  = (answers[2] || 'Control').toLowerCase();\n    const bud = answers[4] || '$100–$200';\n    const reasonText = `Tuned for ${pr}-first play at the ${lvl} level, within your ${bud} budget.`;\n\n    const isWelcome = phase === 'welcome';\n    const isChat = phase === 'chat';\n    const isResults = phase === 'results';\n\n    const progressPct = (Math.min(step, total) / total) * 100;\n    const progressFill = React.createElement('div', {style:{\n      height:'100%', width: progressPct + '%',\n      background:'linear-gradient(90deg,#e0202f,#ff5a5a)', borderRadius:'inherit',\n      transition:'width .45s cubic-bezier(0.05,0.7,0.1,1)', boxShadow:'0 0 12px rgba(224,32,47,.6)'\n    }});\n\n    // demo switcher (presentation chrome)\n    let activeDemo = 'question';\n    if (overlay === 'restart') activeDemo = 'restart';\n    else if (errored) activeDemo = 'error';\n    else if (isWelcome) activeDemo = 'welcome';\n    else if (isResults) activeDemo = resultMode === 'nomatch' ? 'nomatch' : 'results';\n    else if (typing) activeDemo = 'loading';\n    else if (pendingPick) activeDemo = 'selected';\n    const demoList = [['welcome','Welcome'],['question','Question'],['selected','Selected'],['loading','Loading'],['results','Results'],['nomatch','No match'],['error','Error'],['restart','Restart']];\n    const demoSwitcher = React.createElement('div', {style:{display:'flex',flexWrap:'wrap',gap:'7px',justifyContent:'center',maxWidth:'420px'}},\n      demoList.map(([key,label]) => {\n        const active = key === activeDemo;\n        return React.createElement('button', {\n          key, onClick: () => this.setDemo(key),\n          style:{\n            fontFamily:'var(--md-sys-typescale-font-mono)', fontSize:'11px', letterSpacing:'.04em',\n            textTransform:'uppercase', padding:'8px 13px', borderRadius:'99px', cursor:'pointer',\n            border: active ? '1px solid #fff' : '1px solid rgba(255,255,255,.16)',\n            background: active ? '#fff' : 'rgba(255,255,255,.04)',\n            color: active ? '#0a0a0a' : '#9a9aa0', fontWeight: active ? 700 : 500,\n            transition:'all .2s ease'\n          }\n        }, label);\n      })\n    );\n\n    return {\n      isWelcome, isChat, isResults,\n      isChatView: isWelcome || isChat,\n      isMatch: resultMode === 'match',\n      isNoMatch: resultMode === 'nomatch',\n      typing, errored,\n      showChips: isChat && !typing && !errored && step < total,\n      canChange: isChat && step > 0,\n      backVisible: isChat && step > 0,\n      backHidden: !(isChat && step > 0),\n      restartVisible: !isWelcome,\n      restartHidden: isWelcome,\n      showProgress: isChat,\n      hideProgress: !isChat,\n      progressLabel: `Question ${Math.min(step + 1, total)} of ${total}`,\n      subtitleLabel: isResults ? 'Your matches' : 'Paddle Selector',\n      showRestartOverlay: overlay === 'restart',\n      progressFill,\n      messages, options,\n      reasonText,\n      otherPaddles: this.OTHERS,\n      chatRef: this.chatRef,\n      demoSwitcher,\n      onStart: () => this.start(),\n      onChange: () => this.changeLast(),\n      onAskRestart: () => this.askRestart(),\n      onCancelOverlay: () => this.cancelOverlay(),\n      onConfirmRestart: () => this.confirmRestart(),\n      onRetry: () => this.retry()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
